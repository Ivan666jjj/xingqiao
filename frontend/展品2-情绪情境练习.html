<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情绪与情境判断 · 星桥</title>
<link rel="stylesheet" href="assets/xq.css">
<style>
.quiz-card{padding:1.1rem 1.2rem;margin-top:1rem}
.quiz-top{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.quiz-top h2{margin:0;font-size:1.12rem}
.situation{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem}
.situation .label{font-size:.72rem;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:.35em}
.situation p{margin:0;font-size:1rem;line-height:1.7}
.clue{margin-top:.55rem;color:var(--ink-2);font-size:.9rem}
.clue b{color:var(--terra-deep)}
.quiz-opts{display:grid;gap:.6rem}
.qopt{text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:13px;
  padding:.8rem .95rem;font:inherit;font-size:.95rem;cursor:pointer;line-height:1.55}
.qopt:hover:not(:disabled){border-color:var(--apricot);background:var(--surface-2)}
.qopt:disabled{cursor:default}
.qopt.picked{border-color:var(--terra);background:var(--terra-soft)}
.qopt.correct{border-color:var(--sage);background:var(--sage-soft)}
.qopt .n{color:var(--ink-3);font-size:.75rem;margin-right:.5em}
.feedback{margin-top:.9rem;padding:.85rem 1rem;border-radius:12px;border-left:4px solid var(--sage);
  background:var(--sage-soft);font-size:.92rem;line-height:1.65;display:none}
.feedback.on{display:block}
.feedback.alt{border-left-color:var(--apricot);background:var(--apricot-soft)}
.quiz-foot{display:flex;justify-content:space-between;gap:.8rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.result{display:none;margin-top:1rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.result.on{display:block}
.result h3{margin:0 0 .4rem}
@media(max-width:640px){.quiz-card{padding:1rem}}
</style>
</head>
<body data-page="ex2">
<div id="topbar"></div>
<main class="page">
  <div class="page-head">
    <p class="kicker">展品 ②</p>
    <h1>情绪与情境判断</h1>
    <p class="lede">看情境和一个小线索，选一个更可能的感受。答错不会扣分，只会告诉你另一种可能。</p>
  </div>

  <section class="card quiz-card" aria-label="情绪判断题">
    <div class="quiz-top">
      <h2 id="quiz-title">准备开始</h2>
      <span class="chip mute" id="quiz-progress">共 8 题</span>
    </div>
    <div id="quiz-body">
      <p class="note" style="margin:0">点击下面的按钮开始。每道题只凭一个线索判断，不要求“读心”。</p>
    </div>
    <div class="quiz-foot">
      <span class="note" id="quiz-tip">没有计时压力，想多久都可以。</span>
      <button type="button" class="btn btn-sm" id="quiz-start">开始判断</button>
    </div>
    <div class="result" id="quiz-result" aria-live="polite">
      <h3 id="result-title">这一组结束了</h3>
      <p id="result-text"></p>
      <p style="margin:.5rem 0 .6rem">现在感觉怎么样？（可不选）</p>
      <div class="mood-row" id="quiz-mood"></div>
    </div>
  </section>

  <p class="note" style="margin-top:1rem">题目与反馈是练习用的合成情境，不是心理测评，也不做诊断。</p>
</main>

<script src="assets/xq.js"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const body = $('quiz-body'), title = $('quiz-title'), progress = $('quiz-progress');
  const startBtn = $('quiz-start'), tip = $('quiz-tip');
  const result = $('quiz-result'), resultTitle = $('result-title'), resultText = $('result-text');

  const ITEMS = [
    {situation:'同学说“没事”，但一直低头收书包，没看你。', clue:'嘴上说没事，动作却有点收着。',
     options:['真的完全没事','还有点不舒服，但不想说','想让你立刻离开'], answer:1,
     explain:'语言和动作不一致时，先按“可能还有点不舒服”处理，给对方一点空间。'},
    {situation:'你讲了很久自己感兴趣的话题，对方开始看手机，只回“嗯”。', clue:'看手机、只回一个字。',
     options:['他还想继续听','可能有点走神了','他很讨厌你'], answer:1,
     explain:'更可能只是注意力掉了。可以停一下，问一句“你还想听吗”。'},
    {situation:'老师说“你再说一遍”，眉头皱了一下。', clue:'皱眉 + 让你重复。',
     options:['他没听清','他一定在生气','他觉得你故意捣乱'], answer:0,
     explain:'课堂上更常见的原因是没听清。把刚才那句说慢一点、清楚一点就好。'},
    {situation:'同学答应放学借你笔记，但放学先走了。', clue:'答应过，却没有出现。',
     options:['他故意骗你','可能临时忘了或有事','他讨厌你'], answer:1,
     explain:'一次没做到不等于故意。可以第二天问一句“昨天是不是有事”。'},
    {situation:'你问朋友想吃什么，他说“随便”。', clue:'语气很平，没有看你。',
     options:['真的什么都可以','可能不想做决定，也可能在客气','他在生你的气'], answer:1,
     explain:'“随便”常常是“我不想决定”。可以给两个具体选项，让对方二选一。'},
    {situation:'同学笑着拍你肩膀，说“你又来了”。', clue:'笑着 + 拍肩。',
     options:['在打招呼或开玩笑','在攻击你','他很害怕你'], answer:0,
     explain:'熟悉的人笑着拍肩，多数是打招呼。如果你不舒服，也可以直接说“我不太喜欢被拍”。'},
    {situation:'妈妈叹气说“你什么时候能自己收拾”。', clue:'叹气 + 具体的要求。',
     options:['她担心你，也有点累','她讨厌你','她想把你赶走'], answer:0,
     explain:'叹气更可能是在表达累和担心。可以回一句“我现在收，十分钟”。'},
    {situation:'你约同学周末出去，他说“下次吧”。', clue:'没有给具体时间。',
     options:['这次不方便','永远都不想和你出去','他很讨厌你'], answer:0,
     explain:'“下次吧”通常是这次不方便。可以再给一个具体时间，看对方是否接。'}
  ];
  const N = ITEMS.length;
  let idx = -1, items = [], qStart = 0, locked = false, runStart = 0, finished = false;

  function renderQuestion(){
    const q = ITEMS[idx];
    title.textContent = '第 ' + (idx+1) + ' 题';
    progress.textContent = (idx+1) + ' / ' + N;
    body.innerHTML = `
      <div class="situation">
        <div class="label">情境</div>
        <p>${XQ.esc(q.situation)}</p>
        <p class="clue"><b>线索：</b>${XQ.esc(q.clue)}</p>
      </div>
      <div class="quiz-opts">
        ${q.options.map((o,i)=>`<button type="button" class="qopt" data-i="${i}">
          <span class="n">${'ABC'[i]}</span>${XQ.esc(o)}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>`;
    body.querySelectorAll('.qopt').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i)));
    locked = false; qStart = performance.now();
    startBtn.style.display = 'none';
    tip.textContent = '选一个更可能的解释；不确定也没关系。';
  }

  function choose(i){
    if(locked) return;
    locked = true;
    const q = ITEMS[idx];
    const rt = Math.round(performance.now() - qStart);
    const correct = i === q.answer;
    items.push({emotion:q.options[q.answer], choice:q.options[i], correct, rtMs:rt});
    body.querySelectorAll('.qopt').forEach((b,k)=>{
      b.disabled = true;
      if(k===i) b.classList.add('picked');
      if(k===q.answer) b.classList.add('correct');
    });
    const fb = $('feedback');
    fb.classList.add('on');
    if(correct){
      fb.innerHTML = '<b>更可能的是：</b>' + XQ.esc(q.options[q.answer]) + '<br>' + XQ.esc(q.explain);
    }else{
      fb.classList.add('alt');
      fb.innerHTML = '<b>另一种可能：</b>' + XQ.esc(q.options[q.answer]) + '<br>' + XQ.esc(q.explain)
        + '<br><span class="note">你选的也不是错，只是这条线索不足以确定。</span>';
    }
    startBtn.style.display = '';
    startBtn.textContent = (idx === N-1) ? '看这一组小结' : '下一题';
    tip.textContent = '没有倒计时，也没有排名。';
  }

  function next(){
    if(idx === -1){ begin(); return; }
    if(idx >= N-1){ finish(); return; }
    idx++; renderQuestion();
  }

  function begin(){
    idx = 0; items = []; runStart = Date.now(); finished = false;
    result.classList.remove('on');
    renderQuestion();
  }

  function finish(){
    finished = true;
    const correct = items.filter(x=>x.correct).length;
    const avgRt = Math.round(items.reduce((a,b)=>a+b.rtMs,0)/items.length);
    XQ.update(s=>{
      s.quizRuns.unshift({id:'q'+XQ.uid(), ts:Date.now(), total:N, correct, avgRt, items,
        mood:null, source:'本机练习'});
    });
    title.textContent = '这一组结束了';
    progress.textContent = N + ' / ' + N;
    body.innerHTML = '<p class="note" style="margin:0">没有分数排名。你只需要知道：哪一种解释更可能，以及下次可以怎么问。</p>';
    result.classList.add('on');
    resultTitle.textContent = '这组你选了 ' + correct + ' 次更可能的解释';
    resultText.textContent = '平均每题 ' + (avgRt/1000).toFixed(1) + ' 秒。' +
      (correct === N ? '线索都用上了。' : '不确定的地方，可以下次再看一遍线索。');
    startBtn.style.display = '';
    startBtn.textContent = '再来一组';
    XQ.moodScale($('quiz-mood'), v=>{
      XQ.update(s=>{ if(s.quizRuns[0]) s.quizRuns[0].mood = v; });
      XQ.toast('情绪评分已保存',{icon:'heart'});
    });
  }

  startBtn.addEventListener('click', ()=>{
    if(finished || idx === -1){ begin(); return; }
    if(idx >= N-1){ finish(); return; }
    idx++; renderQuestion();
  });
})();
</script>
</body>
</html>
